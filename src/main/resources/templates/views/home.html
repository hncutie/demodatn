<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Home Page</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>
    <div th:replace="~{views/layout/nav :: nav}"></div>
    <div th:replace="views/layout/header :: header"></div>

    <h1>TRANG CHỦ</h1>
    <h1>Danh sách danh mục</h1>
    <ul>
        <li th:each="category : ${categories}" th:text="${category.name}"></li>
    </ul>

    <h1>Danh sách khóa học</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Tiêu đề</th>
                <th>Mô tả</th>
                <th>Giá</th>
                <th>Danh mục</th>
                <th>Ngày tạo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="course : ${courses}">
                <td th:text="${course.title}"></td>
                <td th:text="${course.description}"></td>
                <td th:text="${course.price} + ' VNĐ'"></td>
                <td th:text="${course.category.name}"></td>
                <td th:text="${#dates.format(course.createdAt, 'dd/MM/yyyy')}"></td>
            </tr>
        </tbody>
    </table>
    <div th:replace="views/layout/footer :: footer"></div>
</body>

</html>
