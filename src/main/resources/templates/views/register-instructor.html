<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng ký làm giảng viên</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

</head>

<body>
    <div th:replace="~{views/layout/nav :: nav}"></div>
    <div th:replace="views/layout/header :: header"></div>
    <h2>Đăng ký Giảng viên</h2>
    <form th:action="@{/register-instructor}" th:object="${instructorDTO}" method="post" enctype="multipart/form-data">
        <label>Số điện thoại:</label>
        <input type="text" th:field="*{phone}" /><br />

        <label>Ảnh đại diện:</label>
        <input type="file" name="avatarFile" accept="image/*" /><br />

        <label>Tiểu sử:</label>
        <textarea th:field="*{bio}"></textarea><br />

        <label>Kinh nghiệm (năm):</label>
        <input type="number" th:field="*{experience}" /><br />

        <button type="submit">Đăng ký</button>
    </form>

    <script>
        document.getElementById('avatarInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const preview = document.getElementById('avatarPreview');

            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.src = '#';
                preview.style.display = 'none';
            }
        });
    </script>
