<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng ký</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        #avatarPreview {
            width: 100px;
            height: 100px;
            border: 1px solid #ccc;
            margin-top: 10px;
            display: none;
            /* Ẩn mặc định */
        }
    </style>
</head>

<body>
    <div th:replace="~{views/layout/nav :: nav}"></div>
    <div th:replace="views/layout/header :: header"></div>

    <!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>Đăng ký</title>
    </head>

    <body>
        <h1>Đăng ký tài khoản</h1>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <div>
                <label>Tên:</label>
                <input type="text" th:field="*{name}" required />
            </div>
            <div>
                <label>Email:</label>
                <input type="email" th:field="*{email}" required />
            </div>
            <div>
                <label>Mật khẩu:</label>
                <input type="password" th:field="*{password}" required />
            </div>
            <div>
                <button type="submit">Đăng ký</button>
            </div>

            <div th:if="${#fields.hasErrors('email')}" style="color:red">
                <p th:errors="*{email}">Lỗi email</p>
            </div>
        </form>

    </body>

    </html>


</body>

</html>
