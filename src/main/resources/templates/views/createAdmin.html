<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Admin</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-lg rounded-4">
                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">Tạo tài khoản Admin</h2>

                        <form th:action="@{/create-admin}" method="post" th:object="${user}">

                            <div class="mb-3">
                                <label class="form-label">Email:</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Nhập email"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mật khẩu:</label>
                                <input type="password" th:field="*{password}" class="form-control"
                                    placeholder="Nhập mật khẩu" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Tạo Admin</button>
                            </div>

                        </form>

                        <!-- Thông báo lỗi -->
                        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

                        <!-- Thông báo thành công -->
                        <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>

                        <div class="text-center mt-3">
                            <a href="/login" class="text-decoration-none">Quay lại đăng nhập</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS (Popper + Bootstrap JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
